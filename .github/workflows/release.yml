# DCODE Release 工作流：打 tag 推送后自动构建免命令安装包并上传到 GitHub Releases。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable release package
        run: npm run package

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/out/DCODE-v*-portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
