<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    DCODE 活动栏图标：实心字母「D」。
    设计要点（针对 VS Code 活动栏的 mask 渲染机制）：
      - VS Code 把该 SVG 作为 CSS -webkit-mask 使用，并以主题前景色填充「不透明区域」，
        因此真正决定可见性的是「形状的实心程度」而非 fill 颜色；细线条在 16px 下极易看不清。
      - 这里用「外轮廓 D + 内部镂空（fill-rule:evenodd）」构成笔画足够粗的实心字形，
        在浅色/深色主题与小尺寸下都清晰可辨。
      - 仍保留 fill="currentColor"，以便在「非 mask 场景」（如部分网页预览/旧版渲染）也能正常着色。
      - 不在根元素写 fill="none"：避免某些渲染器把整图视为透明导致「看不见但可点击」。
  -->
  <path
    fill="currentColor"
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M3 3h7.5c4.97 0 9 4.03 9 9s-4.03 9-9 9H3V3zm3.2 3.2v11.6h4.3a5.8 5.8 0 0 0 0-11.6H6.2z"
  />
</svg>
